<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" /><meta name="color-scheme" content="light">
<title>{{TITLE}} · Cover</title>
<style>
:root{
  --bg:{{BG}}; --ink:{{INK}}; --ink-soft:{{INK_SOFT}}; --line:{{LINE}};
  --accent:{{ACCENT}}; --accent-deep:{{ACCENT_DEEP}};
  --font:"PingFang SC","Hiragino Sans GB","Noto Sans SC",sans-serif;
  --mono:"SF Mono","JetBrains Mono",ui-monospace,monospace;
  --cv-w:{{CV_W}}px; --cv-h:{{CV_H}}px;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;}
.cover{width:var(--cv-w);height:var(--cv-h);position:relative;background:var(--bg);overflow:hidden;
  padding:{{PAD_Y}}px {{PAD_X}}px;display:flex;flex-direction:column;}
.top{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:22px;border-bottom:2px solid var(--ink);}
.kicker{font-family:var(--mono);font-size:25px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--ink);}
.kicker .dot{color:var(--accent);}
.index{font-family:var(--mono);font-size:22px;letter-spacing:.14em;color:var(--ink-soft);}
.body{flex:1;display:flex;flex-direction:column;justify-content:flex-start;padding-top:66px;}
.title{font-weight:250;font-size:{{TITLE_SIZE}}px;line-height:1.04;letter-spacing:-.035em;color:var(--ink);}
.title .line{display:block;white-space:nowrap;width:fit-content;max-width:100%;}
.title .accent{color:var(--accent);}
.title .brand{display:block;font-size:.40em;line-height:1.14;letter-spacing:.015em;color:var(--ink-soft);margin-bottom:.10em;font-weight:700;}
.sub{font-weight:500;font-size:{{SUB_SIZE}}px;line-height:1.3;letter-spacing:.005em;color:var(--ink);margin-top:26px;}
.sub .mark{color:var(--bg);background:var(--accent);padding:2px 14px 6px;border-radius:2px;}
.shot{margin-top:52px;border:2px solid var(--ink);line-height:0;overflow:hidden;background:#fff;
  flex:1 1 auto;min-height:0;}
.shot img{width:100%;height:100%;object-fit:{{SHOT_FIT}};object-position:top center;display:block;}
.foot{margin-top:44px;padding-top:22px;border-top:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:baseline;
  font-family:var(--mono);font-size:23px;letter-spacing:.06em;color:var(--ink-soft);}
.foot .val{color:var(--ink);font-weight:600;}
</style>
</head>
<body>
<div class="cover">
  <!--BLOCK:top-->
  <div class="top">
    <div class="kicker">{{KICKER}}</div>
    <div class="index">{{INDEX}}</div>
  </div>
  <!--/BLOCK:top-->
  <div class="body">
    <h1 class="title">{{TITLE_HTML}}</h1>
    <!--BLOCK:sub-->
    <p class="sub">{{SUB_HTML}}</p>
    <!--/BLOCK:sub-->
    <div class="shot"><img src="file://{{SHOT}}" alt=""></div>
  </div>
  <!--BLOCK:foot-->
  <div class="foot">
    <span>{{FOOT_L}}</span>
    <span class="val">{{FOOT_R}}</span>
  </div>
  <!--/BLOCK:foot-->
</div>
<script>
(function autofit(){
  var t = document.querySelector('.title');
  if(!t) return;
  var s = parseFloat(getComputedStyle(t).fontSize), floor = s*0.55, box = (t.clientWidth || 900)*0.96;
  var ls = t.querySelectorAll('.line'), guard = 0;
  function over(){
    if(!ls.length) return t.scrollWidth > box + 2;
    for(var i=0;i<ls.length;i++){ if(ls[i].scrollWidth > box + 2) return true; }
    return false;
  }
  while((over() || t.scrollHeight > s*2.25) && s > floor && guard++ < 120){
    s -= 3; t.style.fontSize = s + 'px';
  }
})();
</script>
</body>
</html>
