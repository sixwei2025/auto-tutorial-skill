<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <radialGradient id="cGlow" cx="50%" cy="48%" r="54%">
      <stop offset="0%" stop-color="#2E6BFF" stop-opacity=".46"/>
      <stop offset="52%" stop-color="#1A3E9E" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#05080F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cGold" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="640" y2="420">
      <stop offset="0%" stop-color="#FFF4B8"/><stop offset="38%" stop-color="#FFCE45"/><stop offset="100%" stop-color="#E08A0B"/>
    </linearGradient>
    <filter id="cRing" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <ellipse cx="320" cy="210" rx="300" ry="192" fill="url(#cGlow)"/>

  <!-- 终端窗 -->
  <rect x="120" y="96" width="400" height="240" rx="16" fill="#0B1730" stroke="url(#cGold)" stroke-width="5.5" filter="url(#cRing)"/>
  <line x1="120" y1="146" x2="520" y2="146" stroke="url(#cGold)" stroke-width="3.4" opacity=".7"/>
  <circle cx="154" cy="121" r="7" fill="url(#cGold)"/>
  <circle cx="180" cy="121" r="7" fill="url(#cGold)" opacity=".6"/>
  <circle cx="206" cy="121" r="7" fill="url(#cGold)" opacity=".35"/>

  <!-- 代码行 -->
  <g stroke="url(#cGold)" stroke-width="6" stroke-linecap="round" opacity=".8">
    <line x1="160" y1="186" x2="300" y2="186"/>
    <line x1="160" y1="222" x2="380" y2="222"/>
    <line x1="160" y1="258" x2="340" y2="258"/>
    <line x1="160" y1="294" x2="270" y2="294"/>
  </g>

  <!-- > 提示符 -->
  <path d="M424 208 l26 20 l-26 20" fill="none" stroke="url(#cGold)" stroke-width="7"
        stroke-linecap="round" stroke-linejoin="round" filter="url(#cRing)"/>
  <line x1="466" y1="248" x2="492" y2="248" stroke="url(#cGold)" stroke-width="7" stroke-linecap="round"/>

  <ellipse cx="320" cy="392" rx="210" ry="18" fill="url(#cGold)" opacity=".18" filter="url(#cRing)"/>
</svg>
