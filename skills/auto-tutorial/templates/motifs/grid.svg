<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <radialGradient id="gGlow" cx="50%" cy="52%" r="52%">
      <stop offset="0%" stop-color="#2E6BFF" stop-opacity=".46"/>
      <stop offset="50%" stop-color="#16307A" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#05080F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF4B8"/>
      <stop offset="40%" stop-color="#FFCE45"/>
      <stop offset="100%" stop-color="#E08A0B"/>
    </linearGradient>
    <linearGradient id="gCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1B4390" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#091633" stop-opacity=".96"/>
    </linearGradient>
    <filter id="gBlur" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="gSoft" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <ellipse cx="320" cy="210" rx="308" ry="200" fill="url(#gGlow)"/>

  <!-- 后层卡片 -->
  <g transform="translate(0,-30) skewX(-14) translate(96,0)" opacity=".42">
    <rect x="70" y="126" width="400" height="104" rx="16" fill="url(#gCard)" stroke="url(#gGold)" stroke-width="2"/>
  </g>
  <!-- 中层卡片 -->
  <g transform="translate(0,-14) skewX(-7) translate(44,0)" opacity=".68">
    <rect x="66" y="146" width="452" height="114" rx="16" fill="url(#gCard)" stroke="url(#gGold)" stroke-width="2.4"/>
  </g>

  <!-- 前层主卡 -->
  <g filter="url(#gSoft)">
    <rect x="52" y="166" width="500" height="196" rx="20" fill="url(#gCard)" stroke="url(#gGold)" stroke-width="3.4"/>
    <rect x="80" y="196" width="132" height="18" rx="9" fill="url(#gGold)" opacity=".88"/>
    <rect x="80" y="234" width="444" height="3" rx="1.5" fill="url(#gGold)" opacity=".32"/>
    <g fill="url(#gGold)" opacity=".58">
      <rect x="80" y="256" width="150" height="12" rx="6"/>
      <rect x="238" y="256" width="88" height="12" rx="6"/>
      <rect x="352" y="256" width="62" height="12" rx="6"/>
      <rect x="80" y="288" width="196" height="12" rx="6"/>
      <rect x="284" y="288" width="74" height="12" rx="6"/>
      <rect x="382" y="288" width="48" height="12" rx="6"/>
      <rect x="80" y="320" width="128" height="12" rx="6"/>
      <rect x="216" y="320" width="98" height="12" rx="6"/>
      <rect x="340" y="320" width="70" height="12" rx="6"/>
    </g>
  </g>

  <!-- 右上勾选徽章 -->
  <g filter="url(#gSoft)">
    <circle cx="524" cy="158" r="38" fill="#0A1428" stroke="url(#gGold)" stroke-width="3.4"/>
    <path d="M508 158 l10 11 l20 -23" fill="none" stroke="url(#gGold)" stroke-width="6"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <ellipse cx="330" cy="396" rx="240" ry="18" fill="url(#gGold)" opacity=".18" filter="url(#gBlur)"/>
</svg>
