<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <radialGradient id="oGlow" cx="50%" cy="48%" r="52%">
      <stop offset="0%" stop-color="#2E6BFF" stop-opacity=".52"/>
      <stop offset="46%" stop-color="#1A3E9E" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#05080F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="oBall" cx="34%" cy="28%" r="78%">
      <stop offset="0%" stop-color="#D6ECFF"/>
      <stop offset="26%" stop-color="#66A3FF"/>
      <stop offset="62%" stop-color="#1E4FC4"/>
      <stop offset="100%" stop-color="#08194A"/>
    </radialGradient>
    <linearGradient id="oGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF4B8"/>
      <stop offset="38%" stop-color="#FFCE45"/>
      <stop offset="100%" stop-color="#E08A0B"/>
    </linearGradient>
    <filter id="oBlur" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="oRing" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <ellipse cx="320" cy="206" rx="300" ry="196" fill="url(#oGlow)"/>

  <!-- 后轨：细、半透 -->
  <ellipse cx="320" cy="212" rx="286" ry="76" fill="none" stroke="url(#oGold)"
           stroke-width="2.2" opacity=".32" transform="rotate(11 320 212)"/>

  <!-- 星球 -->
  <circle cx="320" cy="200" r="132" fill="url(#oBall)"/>
  <ellipse cx="278" cy="146" rx="52" ry="33" fill="#FFFFFF" opacity=".42" filter="url(#oBlur)"/>
  <path d="M206 260 A132 132 0 0 0 434 260" fill="none" stroke="#9CC8FF" stroke-width="2" opacity=".32"/>

  <!-- 前轨：粗、发光，压在球上 -->
  <ellipse cx="320" cy="216" rx="272" ry="72" fill="none" stroke="url(#oGold)"
           stroke-width="7.5" transform="rotate(-14 320 216)" filter="url(#oRing)" stroke-linecap="round"/>

  <!-- 环上光点 -->
  <circle cx="72" cy="272" r="11" fill="#FFE58A" filter="url(#oRing)"/>
  <circle cx="566" cy="164" r="8" fill="#FFE58A" filter="url(#oRing)"/>
  <circle cx="320" cy="140" r="4.5" fill="#FFF6CF" opacity=".9"/>

  <!-- 地面反射 -->
  <ellipse cx="320" cy="392" rx="230" ry="20" fill="url(#oGold)" opacity=".20" filter="url(#oBlur)"/>
</svg>
