<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <radialGradient id="pGlow" cx="50%" cy="48%" r="50%">
      <stop offset="0%" stop-color="#2E6BFF" stop-opacity=".50"/>
      <stop offset="50%" stop-color="#16307A" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#05080F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pDisc" cx="38%" cy="30%" r="76%">
      <stop offset="0%" stop-color="#FFFBDF"/>
      <stop offset="30%" stop-color="#FFD855"/>
      <stop offset="72%" stop-color="#E8930C"/>
      <stop offset="100%" stop-color="#8A4F02"/>
    </radialGradient>
    <linearGradient id="pGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF4B8"/>
      <stop offset="40%" stop-color="#FFCE45"/>
      <stop offset="100%" stop-color="#E08A0B"/>
    </linearGradient>
    <filter id="pBlur" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="pSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <ellipse cx="320" cy="196" rx="308" ry="196" fill="url(#pGlow)"/>

  <!-- 外环（虚线节奏感，像时间线刻度） -->
  <circle cx="320" cy="188" r="128" fill="none" stroke="url(#pGold)" stroke-width="2" opacity=".30"
          stroke-dasharray="2 14" stroke-linecap="round"/>
  <circle cx="320" cy="188" r="128" fill="none" stroke="url(#pGold)" stroke-width="2.5" opacity=".55"
          stroke-dasharray="74 870" stroke-linecap="round" transform="rotate(-52 320 188)"/>

  <!-- 主圆盘 -->
  <circle cx="320" cy="188" r="96" fill="url(#pDisc)" filter="url(#pSoft)"/>
  <ellipse cx="296" cy="160" rx="34" ry="22" fill="#FFFFFF" opacity=".42" filter="url(#pBlur)"/>

  <!-- 播放三角（挖空感：用深色三角压在金盘上） -->
  <path d="M296 146 L364 188 L296 230 Z" fill="#0A1224" opacity=".82" transform="translate(8,0)"/>

  <!-- 时间线 -->
  <g filter="url(#pSoft)">
    <rect x="96" y="330" width="448" height="14" rx="7" fill="#0F2148" stroke="url(#pGold)" stroke-width="1.6" opacity=".9"/>
    <rect x="96" y="330" width="278" height="14" rx="7" fill="url(#pGold)" opacity=".92"/>
    <circle cx="374" cy="337" r="12" fill="#FFF6CF" filter="url(#pBlur)"/>
    <circle cx="374" cy="337" r="7.5" fill="url(#pGold)"/>
  </g>
  <!-- 刻度 -->
  <g stroke="url(#pGold)" stroke-width="2" opacity=".45" stroke-linecap="round">
    <line x1="116" y1="362" x2="116" y2="374"/>
    <line x1="204" y1="362" x2="204" y2="374"/>
    <line x1="292" y1="362" x2="292" y2="374"/>
    <line x1="380" y1="362" x2="380" y2="374"/>
    <line x1="468" y1="362" x2="468" y2="374"/>
  </g>

  <!-- 环绕光点 -->
  <circle cx="150" cy="272" r="6.5" fill="#FFE58A" opacity=".9"/>
  <circle cx="510" cy="130" r="5" fill="#FFE58A" opacity=".8"/>

  <ellipse cx="320" cy="392" rx="200" ry="16" fill="url(#pGold)" opacity=".14" filter="url(#pBlur)"/>
</svg>
