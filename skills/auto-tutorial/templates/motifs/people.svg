<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <radialGradient id="pGlow" cx="50%" cy="48%" r="54%">
      <stop offset="0%" stop-color="#2E6BFF" stop-opacity=".46"/>
      <stop offset="52%" stop-color="#1A3E9E" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#05080F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pGold" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="640" y2="420">
      <stop offset="0%" stop-color="#FFF4B8"/><stop offset="38%" stop-color="#FFCE45"/><stop offset="100%" stop-color="#E08A0B"/>
    </linearGradient>
    <filter id="pRing" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <ellipse cx="320" cy="210" rx="300" ry="192" fill="url(#pGlow)"/>

  <!-- 左卡 -->
  <g opacity=".5">
    <rect x="86" y="126" width="128" height="176" rx="14" fill="#0B1730" stroke="url(#pGold)" stroke-width="3.4"/>
    <circle cx="150" cy="182" r="26" fill="none" stroke="url(#pGold)" stroke-width="4.4"/>
    <path d="M118 258 q32 -38 64 0" fill="none" stroke="url(#pGold)" stroke-width="4.4" stroke-linecap="round"/>
    <rect x="112" y="272" width="76" height="6" rx="3" fill="url(#pGold)" opacity=".7"/>
  </g>
  <!-- 右卡 -->
  <g opacity=".5">
    <rect x="426" y="126" width="128" height="176" rx="14" fill="#0B1730" stroke="url(#pGold)" stroke-width="3.4"/>
    <circle cx="490" cy="182" r="26" fill="none" stroke="url(#pGold)" stroke-width="4.4"/>
    <path d="M458 258 q32 -38 64 0" fill="none" stroke="url(#pGold)" stroke-width="4.4" stroke-linecap="round"/>
    <rect x="452" y="272" width="76" height="6" rx="3" fill="url(#pGold)" opacity=".7"/>
  </g>
  <!-- 中卡（选中） -->
  <rect x="252" y="96" width="136" height="216" rx="16" fill="#0E1E42" stroke="url(#pGold)" stroke-width="6.5" filter="url(#pRing)"/>
  <circle cx="320" cy="158" r="30" fill="none" stroke="url(#pGold)" stroke-width="6" filter="url(#pRing)"/>
  <path d="M284 244 q36 -44 72 0" fill="none" stroke="url(#pGold)" stroke-width="6" stroke-linecap="round" filter="url(#pRing)"/>
  <rect x="282" y="262" width="76" height="7" rx="3.5" fill="url(#pGold)" opacity=".85"/>
  <circle cx="388" cy="112" r="20" fill="url(#pGold)" filter="url(#pRing)"/>
  <path d="M379 112 l7 8 l12 -15" fill="none" stroke="#0B1730" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"/>

  <ellipse cx="320" cy="392" rx="210" ry="18" fill="url(#pGold)" opacity=".18" filter="url(#pRing)"/>
